services:
  postgres:
    image: postgres:16
    container_name: llm-eval-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: llm_eval
      POSTGRES_PASSWORD: llm_eval_password
      POSTGRES_DB: llm_eval_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8.4
    container_name: llm-eval-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
